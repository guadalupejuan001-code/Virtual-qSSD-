name: QSSD graphics work memory
on:
  pull_request:
    paths: ['include/qssd/graphics_work_state.hpp','tests/graphics_work_memory.cpp','.github/workflows/graphics-work.yml']
  push:
    branches: [feature/graphics-work-memory-20261109]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: g++ -std=c++17 -O2 -Wall -Wextra -Werror -Iinclude tests/graphics_work_memory.cpp -o /tmp/graphics-work && /tmp/graphics-work
